{% load static %}
<!DOCTYPE html>
<html>
<head>
  <title>{% block title %}LAMPI{% endblock %}</title>

  <meta charset="utf-8">
  <meta name="viewport" content="user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1, width=device-width">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">
  <link rel="stylesheet" type="text/css" href="{% static 'KTALDE_web/css/site.css' %}"/>

  <!-- Hide Alpine.js elements until ready (prevents flash of unstyled content) -->
  <style>[x-cloak] { display: none !important; }</style>

    {% block additional_head_content %}
    {% endblock %}

</head>
<body>
    <div class="page-wrapper">
        <div id="nav-links">
            {% if user.is_authenticated %}
                <form action="{% url 'logout' %}" method="post">
                    {% csrf_token %}
                    <button type="submit" class="btn-link">Logout</button>
                </form>
                {% if user.is_superuser %}
                    <a href="{% url 'admin:index' %}">Admin</a>
                {% endif %}
            {% endif %}
        </div>
        <img src="{% static 'KTALDE_web/images/lampi-bomb-title.png' %}" alt="Lampi Bomb Title" style="display:block; margin: 0 auto 20px; max-width: 500px; height: auto;" />
        <div id="outer-pane">
            {% block content %}
            <p>Content Goes Here.</p>
            {% endblock %}
        </div>
    </div>
</body>
</html>
